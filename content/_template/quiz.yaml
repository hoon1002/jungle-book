# ─────────────────────────────────────────────────────────────
# 상황 퀴즈. 문제는 3~5개 권장. "- id:" 부터 한 문제씩 복사해서 늘린다.
# 상황에는 게임 시간, 아는 정보, 모르는 정보를 함께 적어서
# "정보가 부족한 상태에서 고르는 연습"이 되게 한다.
# ─────────────────────────────────────────────────────────────

- id: q1 # 문제 이름표. q1, q2 처럼 레슨 안에서 겹치지 않게 (기록 저장에 쓰임, 나중에 바꾸지 않기)
  time: "1:25" # 게임 시간 (따옴표로 감싸기)
  known: # 내가 아는 정보 (한 줄이면 known: 문장 처럼 써도 됨)
    - 아는 정보 1
    - 아는 정보 2
  unknown: 모르는 정보 # 여러 개면 known 처럼 목록으로
  question: 이 상황에서 무엇을 할까?
  choices: # 선택지 3~4개. 정답은 correct: true
    - text: 선택지 A
      correct: true
      why: 왜 이게 맞는지 (고르면 바로 보이는 해설)
    - text: 선택지 B
      correct: false
      why: 왜 이게 아닌지
    - text: 선택지 C
      correct: false
      why: 왜 이게 아닌지
  # 정답이 상황마다 달라서 correct: true 가 여러 개면, 어떤 조건인지 꼭 적는다
  # condition: 아군 바텀이 강할 때는 A, 약할 때는 B
